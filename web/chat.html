<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招聘助手</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #f5f6f7;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e3e5e8;
      font-weight: 600;
    }
    .new-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 400;
      background: #fff;
      color: #444;
      border: 1px solid #d4d7dc;
      border-radius: 8px;
    }
    #box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .me { align-self: flex-end; background: #16a34a; color: #fff; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid #e3e5e8; }
    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e3e5e8;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d4d7dc;
      border-radius: 10px;
      outline: none;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <span>招聘助手</span>
    <button id="newChat" class="new-btn">新对话</button>
  </header>
  <div id="box"></div>
  <div class="input-row">
    <input id="q" placeholder="问点什么，比如：上海两年以上的有谁？">
    <button id="send">发送</button>
  </div>

  <script>
    const box = document.getElementById("box");
    const input = document.getElementById("q");
    const btn = document.getElementById("send");
    const newBtn = document.getElementById("newChat");

    function newSessionId() {
      return "web-" + Math.random().toString(36).slice(2, 8);
    }

    let sid = localStorage.getItem("sid");
    if (!sid) {
      sid = newSessionId();
      localStorage.setItem("sid", sid);
    }

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function askAgent(text) {
      const resp = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sid, question: text }),
      });
      if (!resp.ok) return "服务出错了，状态码 " + resp.status;
      const data = await resp.json();
      return data.answer;
    }

    btn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (text === "") return;
      addMessage(text, "me");
      input.value = "";
      btn.disabled = true;
      const bubble = addMessage("思考中……", "bot");
      try {
        bubble.textContent = await askAgent(text);
      } catch (e) {
        bubble.textContent = "连不上服务，确认 uvicorn 窗口还开着";
      }
      box.scrollTop = box.scrollHeight;
      btn.disabled = false;
    });

    newBtn.addEventListener("click", () => {
      sid = newSessionId();
      localStorage.setItem("sid", sid);
      box.innerHTML = "";
    });
  </script>
</body>
</html>
